<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ankita: A Novel in Three Volumes</title>
<meta name="description" content="A small history in three volumes, written for one reader.">
<meta name="theme-color" content="#07080F">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root{
  --night:#07080F;
  --ink:#2A211C;
  --ink-soft:#5A4A3E;
  --paper:#EAE3D2;
  --wax:#7B1630;
  --gilt:#C2A15E;
  --jasper:#6F8BA8;
  --moon:#EDE6D6;
  --fg:#EDE6D6;
  --serif:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sc:"IM Fell English SC","IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --display:"Bodoni Moda","Didot","Bodoni 72","Bodoni MT","Iowan Old Style",Georgia,serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery","URW Chancery L","Lucida Calligraphy",cursive;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .25  0 0 0 0 .16  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fibre:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.004 .09' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .32  0 0 0 0 .2  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --ease-out:cubic-bezier(.2,.75,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--night)}
body{
  font-family:var(--serif);color:var(--fg);background:var(--night);
  font-size:clamp(17px, .55vw + 14px, 21px);line-height:1.55;
  overflow-x:hidden;font-kerning:normal;font-variant-ligatures:common-ligatures;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;height:100vh;height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gilt);outline-offset:4px}
img{max-width:100%;display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#sky,#motes{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#sky{z-index:0}
#motes{z-index:12}
main{position:relative;z-index:2}

/* Paper */
.paper{
  background-color:var(--paper);
  background-image:
    radial-gradient(130% 100% at 45% 35%, rgba(255,252,240,.5), transparent 55%),
    radial-gradient(150% 130% at 50% 50%, transparent 52%, rgba(128,92,48,.26) 100%),
    var(--fibre), var(--noise);
  color:var(--ink);
}

/* Buttons: slim pills with a gilt hairline */
.btn{
  font-family:var(--display);font-style:italic;font-size:16px;letter-spacing:.01em;line-height:1;
  padding:.85em 1.6em;border-radius:999px;border:1px solid rgba(194,161,94,.7);
  color:var(--moon);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .35s, color .35s, border-color .35s, transform .2s;
}
@media (hover:hover){.btn:hover{background:var(--gilt);border-color:var(--gilt);color:#15100b}}
.btn:active{transform:scale(.97)}
.btn:disabled{cursor:default}
.btn:disabled,.btn:disabled:hover{background:rgba(255,255,255,.04);color:var(--moon);border-color:rgba(194,161,94,.7)}
.linkish{font-family:var(--display);font-style:italic;opacity:.6;text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px;transition:opacity .3s}
.linkish:hover{opacity:1}

/* ==========================================================================
   Wax seal (shared)
   ========================================================================== */
.seal{position:relative;width:var(--seal,96px);aspect-ratio:1;display:block;border-radius:50%;
  filter:drop-shadow(0 3px 2px rgba(40,0,10,.55)) drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.seal .half{position:absolute;inset:0;transition:transform 1.1s var(--ease-out), opacity .9s ease .15s}
.seal .half svg{width:100%;height:100%;display:block}
.seal .l{clip-path:polygon(0 0,53% 0,47% 17%,56% 31%,45% 49%,55% 65%,47% 81%,53% 100%,0 100%)}
.seal .r{clip-path:polygon(53% 0,100% 0,100% 100%,53% 100%,47% 81%,55% 65%,45% 49%,56% 31%,47% 17%)}
.cracked .seal .l{transform:translate3d(-38%,26%,80px) rotate(-32deg);opacity:0}
.cracked .seal .r{transform:translate3d(42%,34%,80px) rotate(28deg);opacity:0}
.seal-glow{animation:sealGlow 3.2s ease-in-out infinite}
@keyframes sealGlow{50%{filter:drop-shadow(0 3px 2px rgba(40,0,10,.55)) drop-shadow(0 0 22px rgba(255,150,110,.55))}}

/* ==========================================================================
   The folding letter (shared by overture + correspondence)
   ========================================================================== */
.letter{
  --lw:min(86vw, 500px, 60vh);
  --lh:calc(var(--lw) * 1.36);
  position:relative;width:var(--lw);height:var(--lh);
  transform-style:preserve-3d;
  transition:transform 1.5s var(--ease-out);
}
.letter.lying{transform:translateY(7vh) rotateX(57deg) rotateZ(-8deg) scale(.96)}
@media (hover:hover){.letter.lying:hover{transform:translateY(6vh) rotateX(54deg) rotateZ(-7deg) scale(.97) translateZ(14px)}}
.letter.lying{cursor:pointer}
.lt-shadow{position:absolute;left:4%;right:4%;top:35%;height:30%;background:rgba(0,0,0,.75);filter:blur(22px);
  transform:translateZ(-6px);transition:opacity 1s}
.letter:not(.lying) .lt-shadow{opacity:0}
.lt-panel{position:absolute;left:0;width:100%;height:calc(var(--lh) / 3);transform-style:preserve-3d;
  transition:transform 1.25s cubic-bezier(.55,0,.25,1)}
.lt-mid{top:calc(var(--lh) / 3)}
.lt-top{top:0;transform-origin:50% 100%;transform:translateZ(2px) rotateX(-180deg)}
.lt-bot{top:calc(var(--lh) * 2 / 3);transform-origin:50% 0;transform:translateZ(1px) rotateX(180deg)}
.letter.open1 .lt-top{transform:translateZ(0) rotateX(0deg)}
.letter.open2 .lt-bot{transform:translateZ(0) rotateX(0deg)}
.lt-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lt-back{transform:rotateX(180deg);overflow:visible}
/* fold creases */
.lt-top .lt-front{box-shadow:inset 0 -14px 18px -16px rgba(80,55,25,.55)}
.lt-mid .lt-front{box-shadow:inset 0 14px 18px -16px rgba(80,55,25,.5), inset 0 -14px 18px -16px rgba(80,55,25,.5)}
.lt-bot .lt-front{box-shadow:inset 0 14px 18px -16px rgba(80,55,25,.55)}
.lt-outer{display:grid;justify-items:center;align-content:start;padding-top:11%;gap:3%}
.lt-sheet{position:absolute;left:0;width:var(--lw);height:var(--lh);padding:10% 11% 9%;display:flex;flex-direction:column;text-align:left;
  font-size:calc(var(--lw) * .038);line-height:1.52;color:var(--ink);hyphens:auto;-webkit-hyphens:auto}
.lt-mid .lt-sheet{top:calc(var(--lh) / -3)}
.lt-bot .lt-sheet{top:calc(var(--lh) * -2 / 3)}
.lt-sheet .date{text-align:right;font-style:italic;color:var(--ink-soft);margin-bottom:1.4em}
.lt-sheet .salute{margin-bottom:.6em;text-indent:0!important}
.lt-sheet p + p{text-indent:1.6em}
.lt-sheet .sign{font-family:var(--script);font-size:1.9em;line-height:1.1;text-align:right;margin-top:auto;padding-top:.4em;color:#3b2418;text-indent:0!important}
.lt-sheet .ps{font-style:italic;font-size:.9em;color:var(--ink-soft);margin-top:.8em;text-indent:0!important}
.lt-addr-to{font-style:italic;font-size:calc(var(--lw) * .034);color:var(--ink-soft);margin-bottom:-.6em}
.lt-addr{font-family:var(--script);font-size:calc(var(--lw) * .1);line-height:1;color:#2d1c14;text-align:center;padding:0 6%}
.lt-byhand{position:absolute;top:9%;right:7%;font-style:italic;font-size:calc(var(--lw) * .028);color:var(--ink-soft);transform:rotate(-4deg)}
.lt-outer .seal{--seal:calc(var(--lw) * .19);position:absolute;left:50%;bottom:-2%;translate:-50% 0;z-index:2}

/* ==========================================================================
   Overture
   ========================================================================== */
.overture{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:auto 1fr auto;
  padding:max(5vh, env(safe-area-inset-top)) 5vw max(4vh, env(safe-area-inset-bottom));
  text-align:center;overflow:hidden;
  background:
    radial-gradient(55% 45% at 50% 60%, rgba(255,166,84,calc(.22 * var(--fl,1))), transparent 72%),
    radial-gradient(90% 60% at 50% 105%, #26170d 0%, transparent 70%),
    radial-gradient(140% 100% at 50% 30%, #0c0b12 0%, #050509 80%);
  transition:opacity 1.6s ease, visibility 0s linear 1.6s}
.overture.gone{opacity:0;visibility:hidden}
.ov-line{font-family:var(--display);font-style:italic;font-size:clamp(20px,2.4vw,30px);color:var(--moon);opacity:0;animation:fadeIn 2.4s ease .6s forwards}
.ov-stage{perspective:1300px;perspective-origin:50% 25%;display:grid;place-items:center;min-height:0}
.ov-foot{display:grid;justify-items:center;gap:1.1em;min-height:7.5em;align-content:end}
.ov-hint{font-family:var(--display);font-style:italic;opacity:.75}
.ov-begin{opacity:0;transform:translateY(8px);transition:opacity 1s, transform 1s}
.ov-begin.show{opacity:1;transform:none}
.overture.reading .ov-line{animation:none;opacity:0;transition:opacity .8s}
@keyframes fadeIn{to{opacity:1}}

/* ==========================================================================
   Title page (after the 1813 first edition)
   ========================================================================== */
.titlepage{min-height:150vh;display:grid;place-items:center;padding:16vh 5vw;perspective:1600px}
.tp-sheet{width:min(88vw,500px);aspect-ratio:.66;padding:3.4em 2.2em 3em;text-align:center;display:flex;flex-direction:column;
  justify-content:space-between;align-items:center;box-shadow:0 40px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(120,90,40,.15);
  transform-origin:50% 100%;will-change:transform;font-size:min(4.2vw, 21px)}
.tp-sheet p{line-height:1.25}
.tp-a{font-size:2.6em;letter-spacing:.06em;line-height:1}
.tp-b{font-size:1.25em;letter-spacing:.14em}
.tp-c{font-size:1em;letter-spacing:.18em}
.tp-d{font-size:.78em;letter-spacing:.1em;line-height:1.7!important}
.tp-d span{display:block;font-size:.8em;letter-spacing:.2em}
.tp-e{font-size:1.15em;letter-spacing:.12em}
.tp-f{font-size:.82em;letter-spacing:.06em}
.tp-f i{display:block;letter-spacing:0;font-size:1.1em;margin-bottom:.2em}
.tp-g{font-size:.95em;letter-spacing:.2em}
.rule{width:28%;height:1px;background:currentColor;opacity:.65;border:0}
.rule.wide{width:44%}
.rule.double{width:52%;height:4px;background:none;border-top:1px solid;border-bottom:1px solid;opacity:.6}

/* ==========================================================================
   Volume I: the book
   ========================================================================== */
.vol1{position:relative}
.book-sticky{position:sticky;top:0;height:100vh;height:100svh;display:grid;place-items:center;overflow:hidden;perspective:2400px}
.book-hint{font-family:var(--display);position:absolute;bottom:max(5vh, env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-style:italic;opacity:.7;transition:opacity .8s;pointer-events:none}
.book-wrap{transform:rotateX(var(--bx,12deg)) rotateY(var(--by,0deg)) translateY(var(--bty,0px));transition:transform .2s linear;will-change:transform}
.book{
  --ph:min(76vh, 640px);
  --pw:min(calc(var(--ph) / 1.42), 44vw);
  position:relative;width:calc(var(--pw) * 2);height:var(--ph);perspective:2600px;
}
.book .board{position:absolute;inset:-14px -16px -16px;border-radius:3px 5px 5px 3px;z-index:0;
  background:radial-gradient(120% 100% at 30% 20%, #6c1f2f, #3b0d18 72%), var(--noise);
  box-shadow:inset 0 0 0 6px #3b0d18, inset 0 0 0 7px rgba(194,161,94,.75), inset 0 0 0 11px #3b0d18, inset 0 0 0 12px rgba(194,161,94,.45),
    0 50px 90px rgba(0,0,0,.6), 0 12px 24px rgba(0,0,0,.4)}
.book .edge{position:absolute;top:3px;bottom:3px;width:7px;z-index:0;
  background:repeating-linear-gradient(90deg,#d9cfb6 0 1px,#b9ab8a 1px 2px)}
.book .edge.r{right:-6px;border-radius:0 2px 2px 0}
.book .edge.l{left:-6px;border-radius:2px 0 0 2px}
.book .static,.book .under{position:absolute;top:0;width:var(--pw);height:100%;container-type:size}
.book .static{left:0;z-index:1}
.book .under{left:var(--pw);z-index:1;overflow:hidden}
.leaf{position:absolute;top:0;left:var(--pw);width:var(--pw);height:100%;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;container-type:size;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.face.front .shade{background:linear-gradient(90deg, rgba(40,25,10,.55), rgba(40,25,10,.1) 60%, rgba(255,255,255,.08))}
.face.back .shade{background:linear-gradient(270deg, rgba(40,25,10,.55), rgba(40,25,10,.1) 60%, rgba(255,255,255,.08))}
/* gutters */
.gut-r{box-shadow:inset 26px 0 32px -22px rgba(70,45,20,.45)}
.gut-l{box-shadow:inset -26px 0 32px -22px rgba(70,45,20,.45)}
.marble{position:absolute;inset:0}
.marble svg{width:100%;height:100%;display:block}

.pg{position:absolute;inset:0;padding:7cqh 10cqw 5.5cqh;display:flex;flex-direction:column;color:var(--ink)}
.pg-run{text-align:center;font-family:var(--sc);font-size:2.7cqw;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:5cqh}
.pg-ch{font-family:var(--sc);font-weight:400;font-size:4.2cqw;letter-spacing:.08em;text-align:center}
.pg-title{font-style:italic;font-size:5.4cqw;text-align:center;line-height:1.15;margin-top:.5cqh}
.pg-when{text-align:center;font-style:italic;font-size:3cqw;color:var(--ink-soft);margin-top:.6cqh}
.pg-orn{text-align:center;font-size:3.6cqw;color:var(--ink-soft);margin:1.6cqh 0 2.4cqh;line-height:1}
.pg-body{font-size:3.95cqw;line-height:1.5;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.pg-body p + p{text-indent:1.4em}
.pg-body p:first-child::first-letter{float:left;font-size:3.35em;line-height:.82;padding:.06em .08em 0 0;color:var(--wax)}
.pg-body q{quotes:"\201C" "\201D" "\2018" "\2019";font-style:italic}
.pg-folio{margin-top:auto;text-align:center;font-size:2.9cqw;color:var(--ink-soft)}
.pg-plate{align-items:center;justify-content:center;text-align:center;padding:8cqh 11cqw}
.oval{position:relative;width:64cqw;aspect-ratio:200/260;flex:none}
.oval > img,.oval > video{position:absolute;left:7%;top:5.4%;width:86%;height:89.2%;object-fit:cover;clip-path:ellipse(50% 50%);
  filter:sepia(.45) contrast(1.05) saturate(.85);transition:filter 1.4s}
.leaf.settled .oval > img, .static .oval > img{filter:none}
.oval > img{background:#cfc4ab}
.oval > svg{position:absolute;inset:0;width:100%;height:100%}
.pg-cap{font-style:italic;font-size:3.6cqw;line-height:1.4;margin-top:4cqh;max-width:58cqw}
.pg-plate-no{font-family:var(--sc);font-size:2.8cqw;letter-spacing:.12em;color:var(--ink-soft);margin-top:2.4cqh}
.pg-end{justify-content:center;align-items:center;text-align:center}
.pg-end .fin{font-style:italic;font-size:5.4cqw}
.pg-end .orn{font-size:9cqw;color:var(--wax);margin:3cqh 0;line-height:1}
.pg-end .next{font-size:3.4cqw;color:var(--ink-soft);max-width:60cqw}
.pg-blank{background:transparent}

@media (max-width:760px){
  .book{--pw:min(86vw, 430px);--ph:min(calc(var(--pw) * 1.5), 74vh);width:var(--pw)}
  .book .leaf{left:0}
  .book .static{display:none}
  .book .under{left:0}
  .book .edge.l{display:none}
}

/* ==========================================================================
   Volume headings (shared)
   ========================================================================== */
.vol-head{text-align:center;color:var(--fg);margin:0 auto}
.vol-lede{max-width:34ch;margin:0 auto}
.vol-num{font-family:var(--display);font-style:italic;font-size:clamp(16px,1.3vw,20px);opacity:.75}
.vol-title{font-family:var(--display);font-weight:400;font-size:clamp(48px,7.6vw,116px);line-height:.98;margin:.12em 0 .32em;letter-spacing:-.025em}
.vol-lede{font-family:var(--display);font-style:italic;opacity:.78}

/* ==========================================================================
   Volume II: the ball. A dance card, five dances, five ways to read a letter.
   ========================================================================== */
.vol2{position:relative;padding:22vh 4vw 26vh;overflow:hidden}
.vol2 .vol-head{position:relative;z-index:2}
.ballroom{position:absolute;inset:0;pointer-events:none;perspective:1100px;perspective-origin:50% 30%;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent);
          mask-image:linear-gradient(to bottom, transparent, #000 22%, #000 78%, transparent)}
.ballroom .glow{position:absolute;left:50%;top:58%;width:130vmax;height:70vmax;translate:-50% -50%;
  background:radial-gradient(closest-side, rgba(255,190,120,.22), rgba(255,170,100,.06) 55%, transparent)}
.ballroom .bokeh{position:absolute;inset:0 0 auto 0;height:40%;
  background:
    radial-gradient(circle at 18% 30%, rgba(255,214,150,.55) 0 3px, transparent 18px),
    radial-gradient(circle at 26% 22%, rgba(255,214,150,.4) 0 2px, transparent 14px),
    radial-gradient(circle at 50% 18%, rgba(255,226,170,.65) 0 4px, transparent 26px),
    radial-gradient(circle at 46% 26%, rgba(255,214,150,.4) 0 2px, transparent 12px),
    radial-gradient(circle at 55% 27%, rgba(255,214,150,.45) 0 2px, transparent 14px),
    radial-gradient(circle at 78% 24%, rgba(255,214,150,.5) 0 3px, transparent 20px),
    radial-gradient(circle at 84% 34%, rgba(255,214,150,.35) 0 2px, transparent 12px);
  filter:blur(1.5px);animation:shimmer 6s ease-in-out infinite alternate}
@keyframes shimmer{to{opacity:.65}}
.carousel{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d;
  transform:rotateX(-6deg);animation:none}
.carousel-spin{position:absolute;transform-style:preserve-3d;animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotateY(-360deg)}}
.couple{position:absolute;left:-55px;top:-180px;width:110px;height:184px;transform-style:preserve-3d}
.couple svg{width:100%;height:100%;display:block;animation:turn 2.1s ease-in-out infinite alternate;transform-origin:50% 100%}
.couple path{fill:#140d12}
.couple svg{filter:drop-shadow(0 0 1px rgba(255,200,140,.55)) drop-shadow(0 0 10px rgba(255,170,100,.3))}
@keyframes turn{0%{transform:rotateY(-28deg) translateY(0)}50%{transform:rotateY(0deg) translateY(-5px)}100%{transform:rotateY(28deg) translateY(0)}}

/* the dance card */
.card-wrap{position:relative;z-index:2;display:grid;justify-items:center;margin-top:7vh;perspective:1400px}
.dcard{position:relative;width:min(90vw,500px);padding:2.4em 2.2em 2em;border-radius:6px;color:var(--ink);
  background-color:#F4EFE3;
  background-image:radial-gradient(120% 90% at 30% 10%, rgba(255,255,255,.7), transparent 60%), var(--noise);
  box-shadow:0 0 0 1px rgba(160,125,60,.55), inset 0 0 0 7px #F4EFE3, inset 0 0 0 8px rgba(176,140,72,.75), inset 0 0 0 10px #F4EFE3, inset 0 0 0 11px rgba(176,140,72,.4),
    0 40px 80px rgba(0,0,0,.55), 0 10px 22px rgba(0,0,0,.35);
  transform:rotateX(var(--cx,0deg)) rotateY(var(--cy,0deg));transition:transform .25s ease-out;will-change:transform}
.dc-crest{display:block;margin:0 auto .6em;width:54px;height:auto;color:#a98845}
.dc-venue{font-family:var(--display);font-style:italic;font-size:1.05em;text-align:center;color:var(--ink-soft)}
.dc-title{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,44px);line-height:1.05;text-align:center;margin:.1em 0 .15em;letter-spacing:-.01em}
.dc-for{text-align:center;font-family:var(--script);font-size:1.6em;color:#4a2e1e;line-height:1.1}
.dc-list{list-style:none;margin:1.3em 0 .6em;border-top:1px solid rgba(120,90,40,.3)}
.dc-row{display:grid;grid-template-columns:1.6em 1fr auto;align-items:baseline;gap:.2em .6em;width:100%;text-align:left;
  padding:.85em .4em .8em;border-bottom:1px solid rgba(120,90,40,.22);color:var(--ink);transition:background .35s}
.dc-row:hover,.dc-row:focus-visible{background:linear-gradient(90deg, rgba(194,161,94,.16), rgba(194,161,94,.02))}
.dc-n{font-family:var(--display);font-size:.95em;color:#a98845}
.dc-name{font-family:var(--display);font-size:1.18em;line-height:1.15}
.dc-note{grid-column:2 / 3;font-family:var(--display);font-style:italic;font-size:.82em;color:var(--ink-soft)}
.dc-partner{grid-row:1 / span 2;grid-column:3;align-self:center;min-width:5.4em;text-align:right;font-family:var(--script);font-size:1.45em;color:#6d6458;line-height:1;
  border-bottom:1px dotted rgba(120,90,40,.45);padding-bottom:.1em}
.dc-partner:empty::after{content:"\00a0"}
.dc-row.done .dc-partner{color:#3c3a40;animation:pencil .9s ease both}
@keyframes pencil{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.dc-foot{text-align:center;font-family:var(--display);font-style:italic;font-size:.85em;color:var(--ink-soft);margin-top:.8em}
.dc-cord{position:absolute;right:12%;top:100%;width:2px;height:90px;background:linear-gradient(#b23a52,#7b1630);transform-origin:top;animation:sway 4s ease-in-out infinite alternate}
.dc-cord::after{content:"";position:absolute;left:50%;top:100%;width:9px;height:64px;translate:-50% 0;border-radius:2px 2px 5px 5px;
  background:linear-gradient(90deg,#d8c08a,#f3e3b2 45%,#b9995a);box-shadow:0 6px 10px rgba(0,0,0,.35)}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}

/* ==========================================================================
   Chambers: the full-screen rooms each dance opens into
   ========================================================================== */
dialog.chamber{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:0;color:#EDE6D6;
  background:radial-gradient(90% 70% at 50% 45%, #241a14 0%, #100c0b 55%, #070608 100%);display:none;overflow:hidden}
dialog.chamber[open]{display:grid;grid-template-rows:auto 1fr auto;animation:chIn .6s cubic-bezier(.2,.8,.2,1)}
dialog.chamber::backdrop{background:rgba(5,5,8,.7);backdrop-filter:blur(8px)}
@keyframes chIn{from{opacity:0;transform:scale(1.03)}}
.ch-bar{display:grid;grid-template-columns:1fr auto;align-items:center;padding:max(18px, env(safe-area-inset-top)) clamp(18px,4vw,40px) 10px}
.ch-kicker{font-family:var(--display);font-style:italic;font-size:14px;opacity:.6}
.ch-title{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,30px);line-height:1.1}
.ch-close{grid-row:1 / span 2;grid-column:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(237,230,214,.25);background:rgba(255,255,255,.04);backdrop-filter:blur(10px);transition:background .3s,border-color .3s}
.ch-close:hover{background:rgba(255,255,255,.1);border-color:rgba(237,230,214,.5)}
.ch-close svg{width:16px;height:16px}
.ch-stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;touch-action:none}
.ch-foot{display:grid;justify-items:center;gap:14px;padding:10px 5vw max(22px, env(safe-area-inset-bottom));text-align:center}
.ch-hint{font-family:var(--display);font-style:italic;font-size:clamp(15px,1.2vw,18px);opacity:.75;min-height:1.4em;transition:opacity .4s}
.ch-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:46px}
.ch-actions .btn{font-size:15px}
.btn.ghost{border-color:rgba(237,230,214,.25)}

/* a sheet of paper, shared by the chambers */
.sheet{position:relative;width:min(88vw,540px);aspect-ratio:.76;max-height:100%;border-radius:2px;container-type:inline-size;
  box-shadow:0 30px 70px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4);color:var(--ink)}
.sheet-in{position:absolute;inset:0;padding:9% 10%;font-size:4cqw;line-height:1.55;overflow:hidden}
.sheet-in .salute{margin-bottom:.5em}
.sheet-in p + p{text-indent:1.5em}
.sheet-in .sign{font-family:var(--script);font-size:1.9em;line-height:1.1;text-align:right;margin-top:.6em;color:#3b2418;text-indent:0}

/* 1. the quill */
.qtext .c{opacity:0;filter:blur(2px);color:#5a3a1e;transition:opacity .35s, filter .35s, color 1.6s}
.qtext .c.on{opacity:1;filter:none;color:var(--ink)}
.qtext .w{display:inline-block;white-space:nowrap;text-indent:0}
.quill{position:absolute;left:0;top:0;width:150px;height:150px;pointer-events:none;z-index:3;transform-origin:4px 146px;transition:opacity .6s;
  filter:drop-shadow(8px 14px 8px rgba(0,0,0,.35))}
.quill.gone{opacity:0}
.sand{position:absolute;inset:0;pointer-events:none;opacity:0;
  background-image:radial-gradient(circle, rgba(196,164,104,.95) 0 .8px, transparent 1.4px), radial-gradient(circle, rgba(160,128,74,.8) 0 .7px, transparent 1.2px);
  background-size:7px 9px, 11px 6px;background-position:0 0, 3px 4px}
.sand.fall{animation:sand 2.4s ease forwards}
@keyframes sand{0%{opacity:0;transform:translateY(-12px)}25%{opacity:.9;transform:none}70%{opacity:.9;transform:none}100%{opacity:0;transform:translate(40px,30px)}}

/* 2. invisible ink */
.ink-sheet canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.ink-warm{position:absolute;width:260px;height:260px;left:0;top:0;translate:-50% -50%;border-radius:50%;pointer-events:none;z-index:1;opacity:0;transition:opacity .4s;
  background:radial-gradient(closest-side, rgba(255,170,80,.35), rgba(255,170,80,0));mix-blend-mode:multiply}
.candle{position:absolute;left:0;top:0;width:54px;height:150px;pointer-events:none;z-index:4;translate:-50% 0}
.candle .fl{position:absolute;left:50%;top:0;width:16px;height:30px;translate:-50% 0;border-radius:50% 50% 45% 45% / 65% 65% 35% 35%;
  background:radial-gradient(60% 45% at 50% 72%, #fff8e0 0 25%, #ffd27a 45%, #ff9a3c 70%, rgba(255,120,40,0) 100%);
  animation:flick .12s infinite alternate;filter:blur(.3px)}
.candle .halo{position:absolute;left:50%;top:14px;width:220px;height:220px;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,200,120,.35), transparent);mix-blend-mode:screen}
.candle .wick{position:absolute;left:50%;top:27px;width:2px;height:8px;translate:-50% 0;background:#2a1a10}
.candle .wax{position:absolute;left:50%;top:34px;width:20px;height:76px;translate:-50% 0;border-radius:3px 3px 0 0;
  background:linear-gradient(90deg,#d9cfbd,#fbf6ea 40%,#e4dbc9)}
.candle .stick{position:absolute;left:50%;bottom:0;width:54px;height:40px;translate:-50% 0;border-radius:50% 50% 8px 8px / 30% 30% 8px 8px;
  background:linear-gradient(90deg,#8c6a2c,#f0d48c 40%,#b28a40);box-shadow:0 10px 18px rgba(0,0,0,.4)}
@keyframes flick{from{transform:scale(1,1) rotate(-1deg)}to{transform:scale(.94,1.06) rotate(1.5deg)}}
.candle.parked{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{margin-top:-8px}}

/* 3. the crossed letter */
.cross-wrap{perspective:1400px;display:grid;place-items:center;width:100%;height:100%;cursor:grab}
.cross-wrap:active{cursor:grabbing}
.csheet{--s:min(86vw, 60vh, 600px);position:relative;width:var(--s);height:var(--s);box-shadow:0 30px 70px rgba(0,0,0,.6);transform:rotateX(8deg) rotate(var(--rot,0deg));will-change:transform}
.clayer{position:absolute;inset:0;padding:7% 8%;font-style:italic;font-size:calc(var(--s) * .043);line-height:1.5;text-align:justify;hyphens:auto;-webkit-hyphens:auto;will-change:opacity,filter}
.clayer.b{transform:rotate(-90deg);color:#6a2c22}
.clayer.a{color:#2c1f18}
.clayer .salute{margin-bottom:.3em}
.clayer .sign{font-family:var(--script);font-style:normal;font-size:1.7em;text-align:right;line-height:1.1;margin-top:.2em}
.seg{display:inline-flex;border:1px solid rgba(237,230,214,.25);border-radius:999px;padding:3px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px)}
.seg button{font-family:var(--display);font-style:italic;font-size:15px;padding:.45em 1.1em;border-radius:999px;color:#EDE6D6;opacity:.7;transition:background .3s,opacity .3s,color .3s}
.seg button[aria-pressed="true"]{background:#EDE6D6;color:#16110e;opacity:1}

/* 4. the writing desk */
.desk-stage{perspective:1500px;perspective-origin:50% 20%;display:grid;place-items:center;width:100%;height:100%}
.desk{--W:min(78vw,600px);--D:calc(var(--W) * .64);--H:calc(var(--W) * .15);position:relative;width:var(--W);height:var(--D);transform-style:preserve-3d;
  transform:translateY(4%) rotateX(54deg) rotateZ(-10deg);transition:transform 1s cubic-bezier(.2,.8,.2,1), opacity .8s}
.desk.away{opacity:0;transform:translateY(30%) rotateX(60deg) rotateZ(-10deg) scale(.8)}
.wood{background-color:#4a2215;
  background-image:linear-gradient(90deg, rgba(0,0,0,.18), transparent 30%, rgba(255,200,150,.08) 50%, transparent 70%, rgba(0,0,0,.2)),
    repeating-linear-gradient(92deg, rgba(0,0,0,.0) 0 6px, rgba(0,0,0,.12) 6px 7px, rgba(255,190,140,.05) 7px 9px, rgba(0,0,0,0) 9px 17px),
    var(--fibre), linear-gradient(#5a2a18,#3d1b10)}
.d-shadow{position:absolute;inset:-6% -4%;background:rgba(0,0,0,.65);filter:blur(30px);transform:translateZ(-1px)}
.d-base{position:absolute;inset:0}
.d-wall{position:absolute;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.d-wall.front{left:0;top:100%;width:100%;height:var(--H);transform-origin:50% 0;transform:rotateX(90deg);filter:brightness(1.12)}
.d-wall.back{left:0;bottom:100%;width:100%;height:var(--H);transform-origin:50% 100%;transform:rotateX(-90deg);filter:brightness(.7)}
.d-wall.left{right:100%;top:0;width:var(--H);height:100%;transform-origin:100% 50%;transform:rotateY(90deg);filter:brightness(.85)}
.d-wall.right{left:100%;top:0;width:var(--H);height:100%;transform-origin:0 50%;transform:rotateY(-90deg);filter:brightness(.95)}
.d-wall.front::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:24px;translate:-50% -50%;border-radius:4px;
  background:radial-gradient(circle at 50% 38%, #1a0d06 0 3px, transparent 3.5px), linear-gradient(#1a0d06,#1a0d06) 50% 70% / 2px 8px no-repeat, linear-gradient(135deg,#f3dc9a,#a37a34 60%,#e2c47a);
  box-shadow:0 1px 2px rgba(0,0,0,.5)}
.d-inner{position:absolute;inset:4%;transform:translateZ(calc(var(--H) * .62));border-radius:2px;
  background:radial-gradient(120% 100% at 40% 30%, #2f5a45, #173426 80%);
  box-shadow:inset 0 0 0 2px #0e2318, inset 0 0 0 5px rgba(201,166,90,.55), inset 0 0 0 7px #173426, inset 0 0 0 8px rgba(201,166,90,.3), inset 0 0 40px rgba(0,0,0,.5)}
.d-inner::before{content:"";position:absolute;inset:0;background:var(--noise);opacity:.5;mix-blend-mode:overlay}
.d-tray{position:absolute;left:7%;top:7%;width:58%;height:20%;border-radius:3px;z-index:2;cursor:grab;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6), 0 2px 0 rgba(255,220,170,.15);transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.d-tray.moved{transform:translateX(62%)}
.d-tray .pen{position:absolute;left:8%;top:38%;width:78%;height:9%;border-radius:4px;background:linear-gradient(#f4ecd8,#cdbf9e);transform:rotate(-2deg);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.d-tray .pen.b{top:60%;left:14%;width:64%;background:linear-gradient(#2b2b2b,#0c0c0c)}
.d-ink{position:absolute;right:8%;top:8%;width:12%;aspect-ratio:1;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 50% 50%, #050505 0 34%, #f0d48c 36%, #9c7634 60%, #e9cd84 80%, #6f5220);box-shadow:0 3px 6px rgba(0,0,0,.6)}
.d-spring{position:absolute;left:20%;top:12%;width:7%;aspect-ratio:1;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 35% 30%, #fff1c0, #d0a650 45%, #7a5a1e);box-shadow:0 0 0 3px rgba(0,0,0,.35), 0 0 14px rgba(255,210,120,.0);transition:box-shadow .6s, transform .2s}
.d-spring.ready{box-shadow:0 0 0 3px rgba(0,0,0,.35), 0 0 22px 6px rgba(255,210,120,.55);animation:pulse 1.6s ease-in-out infinite}
.d-spring.pressed{transform:scale(.86);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(0,0,0,.35), 0 0 30px 10px rgba(255,210,120,.3)}}
.d-lid{position:absolute;inset:0;transform-origin:50% 0;transform-style:preserve-3d;transform:translateZ(var(--H)) rotateX(0deg);
  transition:transform 1.4s cubic-bezier(.5,0,.2,1);cursor:pointer}
.d-lid.open{transform:translateZ(var(--H)) rotateX(112deg);cursor:default}
.d-lid > div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px}
.lid-top{box-shadow:inset 0 0 0 1px rgba(0,0,0,.5), inset 0 0 0 9px rgba(0,0,0,.0), inset 0 0 50px rgba(0,0,0,.35)}
.lid-top .inlay{position:absolute;inset:9%;border:1.5px solid rgba(214,180,110,.55);border-radius:2px;box-shadow:inset 0 0 0 5px rgba(0,0,0,.08), inset 0 0 0 6px rgba(214,180,110,.25)}
.lid-top .plate{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:2.4;translate:-50% -50%;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#f6e2a6,#b08638 50%,#e8cb82);box-shadow:0 2px 4px rgba(0,0,0,.6), inset 0 0 0 2px rgba(120,90,30,.6)}
.lid-top .plate span{font-family:var(--script);font-size:calc(var(--W) * .06);color:#5a3f12;line-height:1}
.lid-under{transform:rotateX(180deg);background:radial-gradient(120% 100% at 50% 40%, #6b1e2e, #3b0d18 80%);box-shadow:inset 0 0 0 6px #2a0810, inset 0 0 0 7px rgba(201,166,90,.5)}
.d-drawer{position:absolute;left:52%;top:30%;width:42%;height:50%;transform-style:preserve-3d;transform:translateZ(calc(var(--H) * .22));
  transition:transform 1.1s cubic-bezier(.25,1.4,.45,1)}
.d-drawer.out{transform:translateZ(calc(var(--H) * .22)) translateX(96%)}
.d-drawer .tray-in{position:absolute;inset:0;background:radial-gradient(120% 100% at 40% 30%, #6b1e2e, #3b0d18);box-shadow:inset 0 0 0 4px #3b1a0e, inset 0 6px 14px rgba(0,0,0,.6)}
.d-drawer .face{position:absolute;left:100%;top:0;width:calc(var(--H) * .38);height:100%;transform-origin:0 50%;transform:rotateY(-90deg)}
.d-drawer .face::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c0,#b48a3c 60%,#6f5220)}
.d-letter{position:absolute;left:14%;top:16%;width:72%;height:62%;transform:rotate(-5deg);border-radius:1px;cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.5)}
.d-letter::before{content:"";position:absolute;left:0;right:0;top:46%;height:9%;background:linear-gradient(#b23a52,#7b1630);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.d-letter::after{content:"";position:absolute;left:46%;top:30%;width:14%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%, #b23a52, #5a0d20);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.desk-letter{position:absolute;inset:0;display:grid;place-items:center;perspective:1300px;pointer-events:none;opacity:0;transition:opacity .8s}
.desk-letter.show{opacity:1;pointer-events:auto}
.desk-letter .letter{--lw:min(88vw, 500px, 56vh)}
.chamber .lt-sheet{font-size:calc(var(--lw) * .04)}

/* 5. she writes back */
.reply{position:relative;display:grid;place-items:center;width:100%;height:100%;perspective:1400px}
.rsheet{transition:transform 1.1s cubic-bezier(.6,0,.3,1), opacity .9s}
.rsheet .sheet-in{display:flex;flex-direction:column}
.rsheet textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:#2c1f18;caret-color:var(--wax);
  font:italic 1em/1.55 var(--serif);padding:0;
  background-image:linear-gradient(transparent calc(1.55em - 1px), rgba(111,139,168,.28) calc(1.55em - 1px), rgba(111,139,168,.28) 1.55em, transparent 1.55em);
  background-size:100% 1.55em;background-attachment:local}
.rsheet textarea::placeholder{color:rgba(90,74,62,.55)}
.rsheet .to{font-style:italic;color:var(--ink-soft);margin-bottom:.6em}
.rsheet .from{font-family:var(--script);font-size:1.7em;text-align:right;color:#3b2418;line-height:1.1;margin-top:.3em}
.rsheet.folding{transform:rotateX(70deg) scale(.42)}
.rsheet.flying{transform:translate(42vw,-60vh) rotate(18deg) scale(.12);opacity:0}
.reply .seal{--seal:min(26vw,120px);position:absolute;left:50%;top:50%;translate:-50% -50%;opacity:0;transform:scale(1.8);pointer-events:none}
.reply.stamped .seal{opacity:1;transform:scale(1);transition:transform .45s cubic-bezier(.3,1.6,.5,1), opacity .2s}
.reply.stamped.flown .seal{opacity:0;transform:translate(42vw,-60vh) scale(.2);transition:transform 1.1s cubic-bezier(.6,0,.3,1), opacity .9s}
.reply-done{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:.6em;padding:0 8vw;opacity:0;pointer-events:none;transition:opacity 1s .2s}
.reply-done.show{opacity:1;pointer-events:auto}
.reply-done p:first-child{font-family:var(--display);font-style:italic;font-size:clamp(28px,4vw,48px);line-height:1.15}
.reply-done p:last-child{opacity:.7;font-family:var(--display);font-style:italic}

@media (max-width:760px){
  .desk{--W:68vw;transform:translate(-12%,2%) rotateX(50deg) rotateZ(-8deg)}
  .dc-partner{min-width:2.8em;font-size:1.15em}
  .dcard{padding:2em 1.4em 1.6em}
  .dc-row{grid-template-columns:1.3em 1fr auto}
  .couple{transform:scale(.8)}
}
@media (prefers-reduced-motion:reduce){
  .carousel-spin,.couple svg,.bokeh,.dc-cord{animation:none}
}

/* ==========================================================================
   Volume III: Pemberley
   ========================================================================== */
.vol3{position:relative;height:340vh}
.pem-sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;perspective:1000px;perspective-origin:50% 46%}
.pem-scene{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 50% -650px;will-change:transform}
.layer{position:absolute;left:-15%;top:-15%;width:130%;height:130%;transform-origin:50% 50%;will-change:transform,opacity;pointer-events:none}
.layer > svg{width:100%;height:100%;display:block;overflow:visible}
.sun{position:absolute;left:50%;top:50%;width:36vmin;aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle, #fff7e2 0 18%, rgba(255,226,170,.9) 26%, rgba(255,190,120,.35) 45%, transparent 70%)}
.mist{position:absolute;left:-50%;width:200%;height:30%;opacity:var(--mist,.3);
  background:
    radial-gradient(30% 50% at 15% 50%, rgba(240,236,232,.75), transparent 70%),
    radial-gradient(28% 45% at 42% 55%, rgba(240,236,232,.6), transparent 70%),
    radial-gradient(34% 50% at 68% 48%, rgba(240,236,232,.7), transparent 70%),
    radial-gradient(26% 40% at 90% 55%, rgba(240,236,232,.55), transparent 70%);
  filter:blur(10px);animation:drift 60s linear infinite}
.mist.b{animation-duration:85s;animation-direction:reverse}
@keyframes drift{to{transform:translateX(25%)}}
/* scene palette, driven from script */
.pem-scene{--h1:#141A2E;--h2:#10162A;--stone:#1D2133;--stone2:#151827;--lawn:#0E1512;--lake1:#0E1424;--lake2:#0A0F1C;--tree:#0A100D;--grass:#070B09;--winA:1}
.h1{fill:var(--h1)}.h2{fill:var(--h2)}.st{fill:var(--stone)}.st2{fill:var(--stone2)}.lawn{fill:var(--lawn)}.tree{fill:var(--tree)}.grass{fill:var(--grass)}
.win{fill:#F6C97A;opacity:var(--winA)}
.pem-copy{position:absolute;inset:0;pointer-events:none;color:var(--fg)}
.pc{position:absolute;left:50%;top:8vh;translate:-50% 0;width:min(92vw,900px);text-align:center;opacity:0;will-change:opacity,transform}
.pc .vol-title{font-size:clamp(40px,5.6vw,84px);max-width:12ch;margin-inline:auto}
.pc blockquote{font-family:var(--display);font-style:italic;font-size:clamp(24px,2.7vw,40px);line-height:1.25;max-width:24ch;margin:0 auto}
.pc cite{display:block;font-style:italic;font-family:var(--display);font-size:.46em;letter-spacing:0;margin-top:1em;opacity:.75}

/* ==========================================================================
   The gallery at Pemberley
   ========================================================================== */
.gallery{position:relative;

const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const wait = ms => new Promise(r => setTimeout(r, ms));

const ROMAN = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
const roman = n => ROMAN.reduce((s, [v, r]) => { while (n >= v) { s += r; n -= v; } return s; }, '');
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

async function unfold(el, { lift = true } = {}) {
  el.classList.add('cracked');
  await wait(reduce ? 60 : 650);
  if (lift) el.classList.remove('lying');
  await wait(reduce ? 60 : (lift ? 900 : 200));
  el.classList.add('open1');
  await wait(reduce ? 300 : 950);
  el.classList.add('open2');
  await wait(reduce ? 300 : 1100);
}

function motif(kind, id) {
  const W = '#F4F1EA';
  if (kind === 'rose') {
    const B = '#6F8BA8';
    return `<path d="M100 132 C 97 160 104 178 99 204" stroke="${W}" stroke-width="4" fill="none"/>
      <path d="M100 168 C 84 156 70 160 64 170 C 76 176 90 176 100 168 Z"/><path d="M100 180 C 116 168 130 172 136 182 C 124 188 110 188 100 180 Z"/>
      <path d="M86 170 L 72 167 M114 182 L 128 180" stroke="${B}" stroke-width="1.2"/>
      <circle cx="100" cy="106" r="31"/>
      <g fill="none" stroke="${B}" stroke-width="2" stroke-linecap="round">
        <path d="M100 104 m-5 0 a5 5 0 1 1 10 0 a10 10 0 1 1 -20 2 a15 15 0 1 1 30 -2"/>
        <path d="M74 112 C 78 128 92 136 106 134"/><path d="M126 100 C 128 118 120 130 108 134"/><path d="M80 88 C 88 78 104 76 116 82"/>
      </g>`;
  }
  if (kind === 'quill') {
    return `<path d="M136 60 C 104 78 84 118 76 182 L 82 184 C 92 126 110 90 140 66 Z"/>
      <path d="M140 64 C 120 70 98 96 88 130 C 104 110 122 92 140 64 Z" opacity=".75"/>
      <path d="M78 183 L 72 198 L 82 186 Z"/>
      <path d="M100 196 h46 a4 4 0 0 1 0 8 h-46 Z" opacity=".8"/>
      <rect x="112" y="170" width="24" height="26" rx="3" opacity=".9"/>`;
  }
  if (kind === 'letter') {
    return `<rect x="52" y="96" width="96" height="66" rx="2"/><path d="M52 96 L100 134 L148 96" fill="none" stroke="#6F8BA8" stroke-width="3"/>
      <circle cx="100" cy="134" r="11" fill="#dfe6ee"/><text x="100" y="140" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="16" fill="#6F8BA8">${esc(STORY.monogram)}</text>`;
  }
  if (kind === 'temple') {
    let c = '';
    for (let i = 0; i < 6; i++) c += `<rect x="${64 + i * 13.6}" y="112" width="6" height="52"/>`;
    return `<path d="M54 110 L100 80 L146 110 Z"/><rect x="54" y="108" width="92" height="6"/>${c}<rect x="50" y="164" width="100" height="6"/><rect x="44" y="171" width="112" height="6"/>
      <path d="M40 186 C 70 180 130 180 160 186" stroke="${W}" stroke-width="2.5" fill="none" opacity=".8"/>`;
  }
  // monogram in a laurel wreath
  let leaves = '';
  for (let s of [-1, 1]) for (let i = 0; i < 9; i++) {
    const a = (98 + i * 14) * Math.PI / 180, r = 60;
    const x = 100 + s * Math.cos(a) * r, y = 128 + Math.sin(a) * r;
    leaves += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="10" ry="4" transform="rotate(${(s * (a * 57.3 + 90 + 22)).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  return `${leaves}<text x="100" y="152" text-anchor="middle" font-family="Pinyon Script, Snell Roundhand, cursive" font-size="84">${esc(STORY.monogram)}</text>`;
}
function frameSVG(id, inner) {
  let beads = '';
  for (let i = 0; i < 56; i++) { const a = i / 56 * Math.PI * 2; beads += `<circle cx="${(100 + Math.cos(a) * 95).toFixed(1)}" cy="${(130 + Math.sin(a) * 125).toFixed(1)}" r="2.1"/>`; }
  return `<svg viewBox="0 0 200 260" aria-hidden="true"><defs>
    <radialGradient id="${id}j" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#94AEC8"/><stop offset="1" stop-color="#55708F"/></radialGradient>
    <linearGradient id="${id}gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0D99A"/><stop offset=".5" stop-color="#B58D45"/><stop offset="1" stop-color="#E2C27A"/></linearGradient>
    <filter id="${id}r"><feDropShadow dx="-.8" dy="-.8" stdDeviation=".4" flood-color="#fff" flood-opacity=".9"/><feDropShadow dx="1" dy="1.6" stdDeviation="1" flood-color="#2f4560" flood-opacity=".6"/></filter></defs>
    ${inner === null ? '' : `<ellipse cx="100" cy="130" rx="86" ry="116" fill="url(#${id}j)"/><g fill="#F4F1EA" filter="url(#${id}r)">${inner}</g>`}
    <ellipse cx="100" cy="130" rx="90" ry="120" fill="none" stroke="url(#${id}gl)" stroke-width="7"/>
    <ellipse cx="100" cy="130" rx="85.5" ry="115.5" fill="none" stroke="#8a6a2e" stroke-width="1"/>
    <g fill="url(#${id}gl)">${beads}</g></svg>`;
}

const book = $('#book');
let leaves = [], mobileBook = null;
function pagesLinear() {
  const C = STORY.chapters, out = [plateHTML(C[0], 0)];
  let folio = 1;
  C.forEach((c, i) => { out.push(textHTML(c, i, folio)); folio += 2; out.push(i < C.length - 1 ? plateHTML(C[i + 1], i + 1) : endHTML()); });
  return out;
}
function layoutBook() {
  const m = matchMedia('(max-width:760px)').matches;
  if (m === mobileBook) return;
  mobileBook = m;
  const P = pagesLinear();
  let h = `<div class="board"></div><div class="edge r"></div><div class="edge l"></div>`;
  const leaf = (front, back, k) => `<div class="leaf" data-k="${k}"><div class="face front paper gut-r">${front}<div class="shade"></div></div><div class="face back paper gut-l">${back}<div class="shade"></div></div></div>`;
  if (!m) {
    h += `<div class="static paper gut-l">${P[0]}</div><div class="under paper gut-r">${marbleHTML()}</div>`;
    const n = (P.length - 1) / 2;
    for (let k = 0; k < n; k++) h += leaf(P[2 * k + 1], P[2 * k + 2], k);
  } else {
    h += `<div class="under paper gut-r">${P[P.length - 1]}</div>`;
    for (let k = 0; k < P.length - 1; k++) h += leaf(P[k], '', k);
  }
  book.innerHTML = h;
  leaves = [...book.querySelectorAll('.leaf')].map(el => ({ el, front: el.querySelector('.front .shade'), back: el.querySelector('.back .shade'), t: -1 }));
  $('#vol1').style.height = `calc(${leaves.length} * 72vh + 100vh)`;
  book.querySelectorAll('img[data-fallback]').forEach(img => img.addEventListener('error', () => {
    const id = 'c' + (++uid); img.parentElement.innerHTML = frameSVG(id, motif(img.dataset.fallback, id));
  }, { once: true }));
}
layoutBook();
function updateBook(s) {
  const N = leaves.length, x = s * N;
  leaves.forEach((L, k) => {
    let t = clamp((x - k - .12) / .76);
    t = easeIO(t);
    if (Math.abs(t - L.t) < .0005) return;
    L.t = t;
    const ang = -180 * t;
    let z = t < .5 ? 100 + (N - k) : 200 + k;
    let op = 1;
    if (mobileBook) { op = 1 - smooth(.42, .62, t); }
    L.el.style.transform = `rotateY(${ang.toFixed(2)}deg)`;
    L.el.style.zIndex = z;
    L.el.style.opacity = op;
    L.el.style.visibility = op < .01 ? 'hidden' : '';
    L.el.classList.toggle('settled', t === 0 || t === 1);
    const sh = Math.sin(t * Math.PI);
    L.front.style.opacity = t < .5 ? sh * .9 : 0;
    L.back.style.opacity = t >= .5 ? sh * .9 : 0;
  });
  $('#bookHint').style.opacity = s > .03 ? 0 : .7;
  const turned = leaves.filter(L => L.t > .5).length;
  return Math.min(STORY.chapters.length - 1, mobileBook ? Math.floor(turned / 2) : turned);
}

function chQuill(d, i) {

        <path d="M4 146 L 30 112 C 52 70 92 26 146 4 C 128 40 104 80 64 106 C 52 114 40 118 30 114 Z" fill="url(#qf)" stroke="#bfb29a" stroke-width="1"/>
        <path d="M6 144 L 120 26" stroke="#9c8f78" stroke-width="1.2"/><path d="M4 146 L 14 132" stroke="#1d140e" stroke-width="3" stroke-linecap="round"/></svg>
      <p class="vh">${esc(plain(L))}</p></div>`;

/* ---------------- Motes (3D particles): dust, fireflies, pollen, petals ---------------- */
const Motes = (() => {
  const cv = $('#motes'), ctx = cv.getContext('2d');
  let W = 0, H = 0, list = [], petals = [];
  const sprite = (col, soft) => {
    const s = document.createElement('canvas'); s.width = s.height = 64; const c = s.getContext('2d');
    const g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, col.replace('A', '1')); g.addColorStop(soft, col.replace('A', '.5')); g.addColorStop(1, col.replace('A', '0'));
    c.fillStyle = g; c.fillRect(0, 0, 64, 64); return s;
  };
  const SP = { dust: sprite('rgba(255,206,150,A)', .25), fly: sprite('rgba(226,246,150,A)', .18), pollen: sprite('rgba(255,236,190,A)', .35) };
  function resize(w, h) {
    W = w; H = h;
    const n = reduce ? 18 : (w < 760 * DPR ? 42 : 80);
    const r = rng(5); list = [];
    for (let i = 0; i < n; i++) list.push({ x: r() * 2 - 1, y: r() * 2 - 1, z: .25 + r() * .95, ph: r() * 6.28, sp: .4 + r(), bl: r() * 6.28 });
  }
  function burst(cx, cy) {
    if (reduce) return;
    const r = rng(Date.now() & 0xffff);
    const cols = ['#B23A52', '#D9667E', '#F2C6CF', '#FBE7EA', '#8C1A35', '#F4EBD6'];
    for (let i = 0; i < 110; i++) {
      const a = r() * Math.PI * 2, v = 220 + r() * 520;
      petals.push({ x: cx * DPR, y: cy * DPR, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 260, rot: r() * 6.28, vr: (r() - .5) * 8, fl: r() * 6.28, vf: 2 + r() * 5, s: (5 + r() * 9) * DPR, c: cols[i % cols.length], life: 0 });
    }
  }
  function frame(dt, time, phase, mx, my, flicker, overture) {
    ctx.clearRect(0, 0, W, H);
    const f = Math.min(W, H) * .55, cx = W / 2, cy = H / 2;
    const flyT = smooth(.42, .52, phase) * (1 - smooth(.78, .86, phase));
    const polT = smooth(.8, .9, phase);
    const dustT = Math.max(0, 1 - flyT - polT);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of list) {
      p.y -= dt * (.02 + .03 * p.sp) * (flyT > .5 ? .4 : 1);
      p.x += Math.sin(time * .3 * p.sp + p.ph) * dt * .02;
      if (p.y < -1.2) { p.y = 1.2; p.x = Math.random() * 2 - 1; }
      const px = cx + (p.x - mx * .06) / p.z * f, py = cy + (p.y - my * .04) / p.z * f;
      if (px < -40 || px > W + 40 || py < -40 || py > H + 40) continue;
      const size = (6 / p.z) * DPR;
      const blink = Math.pow(Math.max(0, Math.sin(time * 1.3 * p.sp + p.bl)), 3);
      const base = (overture ? .9 * flicker : .5) * (1.1 - p.z * .5);
      if (dustT > .01) { ctx.globalAlpha = dustT * base * .55; ctx.drawImage(SP.dust, px - size, py - size, size * 2, size * 2); }
      if (flyT > .01) { const s2 = size * 1.6; ctx.globalAlpha = flyT * blink * .95; ctx.drawImage(SP.fly, px - s2, py - s2, s2 * 2, s2 * 2); }
      if (polT > .01) { ctx.globalAlpha = polT * base * .7; ctx.drawImage(SP.pollen, px - size, py - size, size * 2, size * 2); }
    }
    ctx.globalCompositeOperation = 'source-over';
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.life += dt; p.vx *= Math.pow(.25, dt); p.vy = p.vy * Math.pow(.35, dt) + 160 * dt;
      p.x += (p.vx + Math.sin(time * 2 + p.fl) * 40) * dt * DPR * .6; p.y += p.vy * dt * DPR * .6;
      p.rot += p.vr * dt; p.fl += p.vf * dt;
      if (p.y > H + 40 || p.life > 9) { petals.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.cos(p.fl), 1);
      ctx.globalAlpha = Math.min(1, (9 - p.life) / 2);
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .62, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  return { cv, resize, frame, burst };
})();

const Music = (() => {

  const sec = $('#vol1'), top = sec.offsetTop, span = sec.offsetHeight - innerHeight, N = leaves.length;
  const x = clamp((scrollY - top) / span) * N;
  const j = clamp(dir > 0 ? Math.floor(x + .001) + 1 : Math.ceil(x - .001) - 1, 0, N);
  window.scrollTo({ top: top + span * (j / N), behavior: reduce ? 'auto' : 'smooth' });
}
book.addEventListener('click', e => {
  const r = book.getBoundingClientRect();
  bookStep(e.clientX > r.left + r.width / 2 ? 1 : -1);
});
addEventListener('keydown', e => {
  if (overtureOpen || chamber.open) return;
  const r = $('#vol1').getBoundingClientRect();
  if (r.top > 1 || r.bottom < innerHeight - 1) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); bookStep(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); bookStep(-1); }
});

/* ---------------- Pointer / tilt ---------------- */
let mx = 0, my = 0, tmx = 0, tmy = 0;
addEventListener('pointermove', e => { tmx = e.clientX / innerWidth * 2 - 1; tmy = e.clientY / innerHeight * 2 - 1; }, { passive: true });
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  tmx = clamp(e.gamma / 25, -1, 1); tmy = clamp((e.beta - 45) / 25, -1, 1);
}, { passive: true });

/* ---------------- Sizing ---------------- */
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  for (const c of [sky, Motes.cv]) { c.width = Math.round(innerWidth * DPR); c.height = Math.round(innerHeight * DPR); }
  makeStars(sky.width, sky.height);
  Motes.resize(Motes.cv.width, Motes.cv.height);
  layoutBook();
  layoutGallery();
}
addEventListener('resize', resize);
resize();

/* ---------------- Main loop ---------------- */
const secProg = el => { const r = el.getBoundingClientRect(); return clamp(-r.top / Math.max(1, r.height - innerHeight)); };
const place = $('#place'), placeLabel = $('#placeLabel'), placeRail = $('#placeRail');
let last = performance.now(), flicker = 1, flT = 0;
function phaseNow() {
  const y = scrollY + innerHeight * .5;
  const A = [['title', 0], ['vol2', .35], ['vol3', .5]];
  const v3 = $('#vol3'), end = document.documentElement.scrollHeight;
  const pts = A.map(([id, p]) => [$('#' + id).offsetTop, p]);
  pts.push([v3.offsetTop + v3.offsetHeight - innerHeight * .5, .9], [end, 1]);
  if (y <= pts[0][0]) return 0;
  for (let i = 0; i < pts.length - 1; i++) if (y <= pts[i + 1][0]) return lerp(pts[i][1], pts[i + 1][1], (y - pts[i][0]) / Math.max(1, pts[i + 1][0] - pts[i][0]));
  return 1;
}
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const time = now / 1000;
  mx += (tmx - mx) * .05; my += (tmy - my) * .05;

  // candle flicker for the overture
  flT += dt;
  flicker = .86 + .1 * Math.sin(flT * 7.3) * Math.sin(flT * 2.1 + 1) + .06 * Math.sin(flT * 17);
  if (overtureOpen) ov.style.setProperty('--fl', flicker.toFixed(3));

  const phase = overtureOpen ? 0 : phaseNow();
  // foreground ink: light at night, dark by morning
  const inkT = smooth(.7, .82, phase);
  document.body.style.setProperty('--fg', mix('#EDE6D6', '#2A211C', inkT));

  drawSky(phase, time);
  Motes.frame(dt, time, phase, mx, my, flicker, overtureOpen);

  if (!overtureOpen) {
    // title page settles as it arrives
    const tr = $('#tpSheet').getBoundingClientRect();
    const k = clamp((tr.top + tr.height / 2 - innerHeight / 2) / innerHeight, -1, 1);
    $('#tpSheet').style.transform = `rotateX(${(Math.max(0, k) * 34 - Math.min(0, k) * 14).toFixed(2)}deg) rotateY(${(mx * 3).toFixed(2)}deg) translateZ(${(-Math.abs(k) * 80).toFixed(1)}px)`;

    const v1 = $('#vol1'), s1 = secProg(v1), r1 = v1.getBoundingClientRect();
    const chap = updateBook(s1);
    const enter = clamp((r1.top) / innerHeight, 0, 1);
    const bw = $('#bookWrap').style;
    bw.setProperty('--bx', `${(10 + enter * 30 - my * 3).toFixed(2)}deg`);
    bw.setProperty('--by', `${(mx * 4).toFixed(2)}deg`);
    bw.setProperty('--bty', `${(enter * 10).toFixed(1)}vh`);

    const v3 = $('#vol3'), r3 = v3.getBoundingClientRect();
    if (r3.top < innerHeight && r3.bottom > 0) updatePem(secProg(v3), mx, my);
    const gal = $('#gallery'), rg = gal.getBoundingClientRect();
    if (rg.top < innerHeight && rg.bottom > 0) updateGallery(secProg(gal));
    const fin = $('#finale'), rf = fin.getBoundingClientRect();
    if (rf.top < innerHeight && rf.bottom > 0) updateFinale(secProg(fin));

    // place marker
    const mid = innerHeight * .5;
    const inS = id => { const r = $(id).getBoundingClientRect(); return r.top <= mid && r.bottom > mid; };
    let label = '';
    if (inS('#title')) label = 'Title page';
    else if (inS('#vol1')) label = `Volume I, Chapter ${roman(chap + 1)}`;
    else if (inS('#vol2')) label = 'Volume II, the ball';
    else if (inS('#vol3')) label = 'Volume III, Pemberley';
    else if (inS('#gallery')) label = 'Volume III, the gallery';
    else label = 'Volume III, the last page';
    if (placeLabel.textContent !== label) placeLabel.textContent = label;
    place.classList.add('on');
    const docP = scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight);
    placeRail.style.width = (docP * 100).toFixed(1) + '%';
  } else place.classList.remove('on');

  stepHold(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
